name: Core lint

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-lint:
    name: Kotlin static lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: build/tools/detekt
          key: detekt-${{ runner.os }}-${{ hashFiles('runscript/lint.sh') }}
      - name: Lint Kotlin sources without building platform targets
        run: bash runscript/lint.sh
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: build/reports/detekt/
          if-no-files-found: ignore
